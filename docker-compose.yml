services:
  telegraf:
    image: local/telegraf-universal:1.37
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegraf
    restart: unless-stopped
    network_mode: host
    uts: host
    user: "65534:65534"
    read_only: true
    security_opt:
      - no-new-privileges:true
    command:
      - telegraf
      - --config
      - /etc/telegraf/telegraf.conf
      - --config-directory
      - /etc/telegraf/telegraf.d
    environment:
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys
      HOST_MOUNT_PREFIX: /hostfs
      VICTORIAMETRICS_URL: ${VICTORIAMETRICS_URL:-http://victoriametrics.example:8428/api/v1/write}
    group_add:
      - "${DOCKER_GID:?Imposta DOCKER_GID nel file .env; istruzioni in .env.example}"
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - ./telegraf.d:/etc/telegraf/telegraf.d:ro
      - ./docker-prune/collect.sh:/etc/telegraf/docker-prune/collect.sh:ro
      - ./docker-prune/parse.star:/etc/telegraf/docker-prune/parse.star:ro
      - ./docker-prune/cache:/var/cache/docker-prune:rw
      - /root/docker:/compose-host:ro
      - ./image-check:/etc/telegraf/image-check:ro
      - ./image-check/cache:/var/cache/compose-image-check:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/hostfs:ro,rslave
