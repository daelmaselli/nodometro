x-hardened: &hardened
  restart: unless-stopped
  user: "65534:65534"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

x-tool: &tool
  <<: *hardened
  init: true

services:
  telegraf:
    <<: *hardened
    image: telegraf:1.37.3
    network_mode: host
    uts: host
    command: [telegraf, --non-strict-env-handling, --config, /etc/telegraf/telegraf.conf, --config-directory, /etc/telegraf/telegraf.d]
    environment:
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys
      HOST_MOUNT_PREFIX: /hostfs
      VICTORIAMETRICS_URL: ${VICTORIAMETRICS_URL:-http://victoriametrics.example:8428/api/v1/write}
      VICTORIAMETRICS_USERNAME: ${VICTORIAMETRICS_USERNAME:-}
      VICTORIAMETRICS_PASSWORD: ${VICTORIAMETRICS_PASSWORD:-}
      TELEGRAF_HOSTNAME: ${TELEGRAF_HOSTNAME:-}
      TELEGRAF_INTERVAL: ${TELEGRAF_INTERVAL:-30s}
      TELEGRAF_FLUSH_INTERVAL: ${TELEGRAF_FLUSH_INTERVAL:-30s}
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - ./collectors/empty.prom:/metrics/seed/empty.prom:ro
      - ./telegraf.d:/etc/telegraf/telegraf.d:ro
      # Readers never populate volumes: ownership comes from collector images.
      - type: volume
        source: image-metrics
        target: /metrics/images
        read_only: true
        volume:
          nocopy: true
      - type: volume
        source: prune-metrics
        target: /metrics/prune
        read_only: true
        volume:
          nocopy: true
      - type: volume
        source: zfs-metrics
        target: /metrics/zfs
        read_only: true
        volume:
          nocopy: true
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /dev:/dev:ro
      - /run/udev:/run/udev:ro
      - /:/hostfs:ro,rslave

  # Same native Docker plugins and remote-write serializer, isolated socket.
  docker:
    <<: *hardened
    image: telegraf:1.37.3
    profiles: [docker]
    uts: host
    group_add: ["${DOCKER_GID:-65534}"]
    command: [telegraf, --non-strict-env-handling, --config, /etc/telegraf/docker.conf]
    environment:
      VICTORIAMETRICS_URL: ${VICTORIAMETRICS_URL:-http://victoriametrics.example:8428/api/v1/write}
      VICTORIAMETRICS_USERNAME: ${VICTORIAMETRICS_USERNAME:-}
      VICTORIAMETRICS_PASSWORD: ${VICTORIAMETRICS_PASSWORD:-}
      TELEGRAF_HOSTNAME: ${TELEGRAF_HOSTNAME:-}
      TELEGRAF_INTERVAL: ${DOCKER_TELEGRAF_INTERVAL:-${TELEGRAF_INTERVAL:-30s}}
      TELEGRAF_FLUSH_INTERVAL: ${DOCKER_TELEGRAF_FLUSH_INTERVAL:-${TELEGRAF_FLUSH_INTERVAL:-30s}}
    volumes:
      - ./collectors/docker.conf:/etc/telegraf/docker.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  image-check:
    <<: *tool
    healthcheck:
      test: [CMD, python3, /app/collectors/health.py, image-check]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    image: local/nodometro-image-check:2.1.0
    pull_policy: build
    build:
      context: .
      target: image-check
    profiles: [image-check]
    group_add: ["${DOCKER_GID:-65534}"]
    environment:
      IMAGE_CHECK_INTERVAL: ${IMAGE_CHECK_INTERVAL:-6h}
      COMPOSE_IMAGE_CACHE: /var/cache/compose-image-check
      IMAGE_CHECK_HOST_COMPOSE_ROOT: ${COMPOSE_ROOT:-/root/docker}
    volumes:
      - image-metrics:/metrics
      - image-cache:/var/cache/compose-image-check
      - type: bind
        source: ${IMAGE_CHECK_SETTINGS_FILE:-./image-check/settings.json.example}
        target: /app/image-check/settings.json
        read_only: true
        bind:
          create_host_path: false
      - ${COMPOSE_ROOT:-/root/docker}:/compose-host:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  docker-prune:
    <<: *tool
    healthcheck:
      test: [CMD, python3, /app/collectors/health.py, docker-prune]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    image: local/nodometro-docker-prune:2.1.0
    pull_policy: build
    build:
      context: .
      target: docker-prune
    profiles: [docker-prune]
    group_add: ["${DOCKER_GID:-65534}"]
    network_mode: none
    environment:
      DOCKER_PRUNE_INTERVAL: ${DOCKER_PRUNE_INTERVAL:-3h}
    volumes:
      - prune-metrics:/metrics
      - prune-cache:/var/cache/docker-prune
      - /var/run/docker.sock:/var/run/docker.sock:ro

  zfs:
    <<: *tool
    healthcheck:
      test: [CMD, python3, /app/collectors/health.py, zfs]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    image: local/nodometro-zfs:2.1.0
    pull_policy: build
    build:
      context: .
      target: zfs
    profiles: [zfs]
    network_mode: none
    devices: [/dev/zfs:/dev/zfs]
    volumes:
      - zfs-metrics:/metrics

# Compose manages state; down preserves it, down -v deletes it.
volumes:
  image-cache:
  prune-cache:
  image-metrics:
  prune-metrics:
  zfs-metrics:
