[agent]
  interval = "30s"
  flush_interval = "30s"
  omit_hostname = false
  skip_processors_after_aggregators = false

[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = true

[[inputs.mem]]
[[inputs.swap]]
[[inputs.system]]
  fieldexclude = ["uptime_format"]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "overlay", "squashfs", "proc", "sysfs", "cgroup2"]

[[inputs.diskio]]
  skip_serial_number = true

[[inputs.net]]
  interfaces = ["*"]
  [inputs.net.tagdrop]
    interface = ["lo", "veth*", "br-*", "docker*"]

[[outputs.http]]
  url = "${VICTORIAMETRICS_URL}"
  method = "POST"
  data_format = "prometheusremotewrite"
  content_encoding = "identity"
  timeout = "10s"
  [outputs.http.headers]
    Content-Type = "application/x-protobuf"
    Content-Encoding = "snappy"
    X-Prometheus-Remote-Write-Version = "0.1.0"

# BEGIN native Docker monitoring
[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  timeout = "10s"
  gather_services = false
  container_state_include = ["created", "restarting", "running", "removing", "paused", "exited", "dead"]
  # Expensive disk-usage calculation is collected separately every 3 hours.
  storage_objects = []
  perdevice_include = []
  total_include = ["cpu", "blkio", "network"]
  docker_label_include = ["com.docker.compose.project", "com.docker.compose.service", "com.docker.compose.oneoff"]
  tag_env = []

# The Docker input in 1.37 lists running containers. This native HTTP input
# explicitly inventories all states, including stopped containers.
[[inputs.http]]
  urls = ["http+unix:///var/run/docker.sock:/containers/json?all=1"]
  timeout = "10s"
  name_override = "docker_inventory"
  tagexclude = ["url"]
  data_format = "json"
  json_query = '@this.#.{container_name:Names.0,container_state:State,container_image:Image,compose_project:Labels.com\.docker\.compose\.project,compose_service:Labels.com\.docker\.compose\.service,compose_oneoff:Labels.com\.docker\.compose\.oneoff,status:Status,created:Created}'
  tag_keys = ["container_name", "container_state", "container_image", "compose_project", "compose_service", "compose_oneoff"]
  json_string_fields = ["status"]

[[processors.rename]]
  namepass = ["docker", "docker_*"]
  [[processors.rename.replace]]
    tag = "com.docker.compose.project"
    dest = "compose_project"
  [[processors.rename.replace]]
    tag = "com.docker.compose.service"
    dest = "compose_service"
  [[processors.rename.replace]]
    tag = "com.docker.compose.oneoff"
    dest = "compose_oneoff"

[[processors.starlark]]
  namepass = ["docker_inventory"]
  source = '''
def apply(metric):
    name = metric.tags.get("container_name", "")
    if name.startswith("/"):
        metric.tags["container_name"] = name[1:]
    state = metric.tags.get("container_state", "")
    metric.fields["state_code"] = {"running": 0, "created": 1, "removing": 1, "restarting": 2, "paused": 2, "exited": 2, "dead": 2}.get(state, 3)
    status = metric.fields.pop("status", "")
    health = -1
    if "unhealthy" in status:
        health = 2
    elif "(healthy)" in status:
        health = 0
    elif "health: starting" in status:
        health = 1
    metric.fields["health_code"] = health
    metric.tags["container_health"] = {-1: "none", 0: "healthy", 1: "starting", 2: "unhealthy"}.get(health, "unknown")
    return metric
'''
# END native Docker monitoring

# BEGIN docker-prune monitoring
[[inputs.exec]]
  # Actual Docker scan frequency; accepts s, m or h suffixes.
  commands = ["/bin/bash /etc/telegraf/docker-prune/collect.sh 3h"]
  # Publish the cached result between scans.
  interval = "30s"
  timeout = "75s"
  name_override = "docker_prune_raw"
  data_format = "value"
  data_type = "string"
  [inputs.exec.tags]
    source = "docker-prune-monitoring"

[[processors.starlark]]
  namepass = ["docker_prune_raw"]
  script = "/etc/telegraf/docker-prune/parse.star"
# END docker-prune monitoring
