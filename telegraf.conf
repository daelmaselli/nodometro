[agent]
  interval = "${TELEGRAF_INTERVAL:-30s}"
  flush_interval = "${TELEGRAF_FLUSH_INTERVAL:-30s}"
  omit_hostname = false
  skip_processors_after_aggregators = false

[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = true

[[inputs.mem]]
[[inputs.swap]]
[[inputs.system]]
  fieldexclude = ["uptime_format"]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "overlay", "squashfs", "proc", "sysfs", "cgroup2"]

[[inputs.diskio]]
  skip_serial_number = true

[[inputs.net]]
  interfaces = ["*"]
  [inputs.net.tagdrop]
    interface = ["lo", "veth*", "br-*", "docker*"]

[[outputs.http]]
  url = "${VICTORIAMETRICS_URL}"
  username = "${VICTORIAMETRICS_USERNAME}"
  password = "${VICTORIAMETRICS_PASSWORD}"
  method = "POST"
  data_format = "prometheusremotewrite"
  content_encoding = "identity"
  timeout = "10s"
  [outputs.http.headers]
    Content-Type = "application/x-protobuf"
    Content-Encoding = "snappy"
    X-Prometheus-Remote-Write-Version = "0.1.0"

# Atomic snapshots written by independent collectors. Keep acquisition timestamps:
# reading an old file must never make a stopped collector look fresh.
[[inputs.file]]
  files = ["/metrics/**/*.prom"]
  data_format = "prometheus"
  prometheus_metric_version = 2
  prometheus_ignore_timestamp = false
